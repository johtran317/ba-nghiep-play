 .then(function(){ops=[];renderBar();toast('Saved. The player\'s phone gets it on its next sync');openPlayer(p.id);loadPlayers()})
 .catch(function(e){toast('Could not save: '+e.message,1)}).then(function(){b.disabled=false;b.textContent='Save & send'})};
window.addEventListener('beforeunload',function(e){if(ops.length){e.preventDefault();e.returnValue=''}});
/* ---------- hero picker ---------- */
function heroPicker(){var v=preview(),owned=v.gens||{};
 modal('<div class="ch"><h2>Add hero</h2><div class="sp"></div><button class="btn sm ghost" data-x><svg class="ico"><use href="#i-x"/></svg></button></div><div class="cb" style="border-bottom:1px solid var(--line)"><div style="display:flex;gap:8px"><div class="search" style="flex:1"><svg class="ico"><use href="#i-search"/></svg><input class="in" id="hq" placeholder="Search heroes"></div><select class="in" id="hr" style="width:110px"><option value="">All rarities</option><option>SSR</option><option>SR</option><option>R</option></select></div>'+
  '<div style="display:flex;gap:8px;align-items:center;margin-top:10px"><label class="lb" style="margin:0">Starting level</label><input class="in" id="hlv" inputmode="numeric" value="1" style="width:80px"></div></div><div id="hl"></div>');
 function draw(){var q=$('#hq').value.trim().toLowerCase(),r=$('#hr').value;
  $('#hl').innerHTML=D.heroes.filter(function(x){return(!q||x.n.toLowerCase().indexOf(q)>=0||x.id.indexOf(q)>=0)&&(!r||x.r===r)}).map(function(x){var has=!!owned[x.id];
   return'<button class="hpick" data-h="'+x.id+'"'+(has?' disabled':'')+'><img loading="lazy" src="../art/heroes/'+x.id+'/portrait_small.webp" alt="" onerror="this.style.visibility=\'hidden\'"><div style="flex:1"><b>'+esc(x.n)+'</b> <span class="rar '+x.r+'">'+x.r+'</span><div class="soft" style="font-size:12px">'+esc((D.fac||{})[x.f]||x.f)+' · '+x.brs.map(function(b){return BRN[b]||b}).join(' / ')+'</div></div>'+(has?'<span class="chip">Owned</span>':'<span class="chip acc">Add</span>')+'</button>'}).join('')||'<div class="empty">No matching heroes.</div>'}
 $('#hq').oninput=draw;$('#hr').onchange=draw;draw();
 $('#hl').onclick=function(e){var b=e.target.closest('[data-h]');if(!b||b.disabled)return;var id=b.dataset.h,lv=Math.max(1,Math.min(300,Math.floor(+$('#hlv').value||1)));
  ops=ops.filter(function(o){return o.key!=='h'+id});if(!(data().gens||{})[id])ops.push({t:'add',id:id,lv:lv,key:'h'+id});renderBar();owned=preview().gens||{};draw();renderTab();toast('Added '+((D.heroes.filter(function(x){return x.id===id})[0]||{}).n||id))}}
/* ---------- modal ---------- */
function modal(h){var m=$('#modal');m.innerHTML='<div class="mbox">'+h+'</div>';m.classList.remove('hide');var f=m.querySelector('input');if(f)setTimeout(function(){f.focus()},30)}
function closeModal(){$('#modal').classList.add('hide');$('#modal').innerHTML=''}
$('#modal').addEventListener('click',function(e){if(e.target.id==='modal'||e.target.closest('[data-x]'))closeModal()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
function confirmBox(t,body,ok,fn){modal('<div class="ch"><h2>'+esc(t)+'</h2></div><div class="cb"><p style="margin:0">'+esc(body)+'</p></div><div class="mfoot"><button class="btn" data-x>Cancel</button><button class="btn pri" id="cfok">'+esc(ok)+'</button></div>');
 $('#cfok').onclick=function(){var b=$('#cfok');b.disabled=true;Promise.resolve(fn()).then(closeModal).catch(function(e){toast(e.message,1);b.disabled=false})}}
/* ---------- log ---------- */
var ACT={set_save:'Edit save',ban:'Ban',unban:'Unban',send_mail:'Send mail',restore_backup:'Restore'};
function logTable(L,single){if(!L.length)return'<div class="empty">No actions yet.</div>';
 return'<table class="t"><tr><th>Time</th>'+(single?'':'<th>Player</th>')+'<th>Action</th><th>Details</th></tr>'+L.map(function(l){var p=byId(l.target_user),dt=l.detail||{};
  return'<tr><td class="num" style="white-space:nowrap">'+when(l.created_at)+'</td>'+(single?'':'<td>'+(p?esc(p.display_name||pid(p.id)):'<span class="soft">'+pid(l.target_user)+'</span>')+'</td>')+'<td><span class="chip">'+esc(ACT[l.action]||l.action)+'</span></td><td style="max-width:420px">'+esc(dt.note||dt.reason||'')+(dt.version?' <span class="soft">v'+dt.version+'</span>':'')+'</td></tr>'}).join('')+'</table>'}
function loadLog(){$('#logt').innerHTML='<div class="empty"><span class="spin" style="display:inline-block"></span></div>';
 api('/rest/v1/admin_log?select=*&order=created_at.desc&limit=200').then(function(L){$('#logt').innerHTML=logTable(L||[])}).catch(function(e){$('#logt').innerHTML='<div class="empty">'+esc(e.message)+'</div>'})}
$('#blog').onclick=loadLog;
$$('nav.tabs button').forEach(function(b){b.onclick=function(){$$('nav.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});var t=b.dataset.tab;$('#vplayers').classList.toggle('hide',t!=='players');$('#vlog').classList.toggle('hide',t!=='log');if(t==='log')loadLog()}});
/* ---------- go ---------- */
try{sess=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){sess=null}
if(sess&&sess.rt)start().catch(function(e){showLogin(e.status===401?'':'Could not reach the server: '+e.message)});else showLogin();
})();
</script>
